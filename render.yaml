services:
  - type: web
    name: muyuan-livestock-iot
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python platform_server.py --host 0.0.0.0 --no-mqtt
    healthCheckPath: /api/platform
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AMAP_KEY
        sync: false
      - key: AMAP_SECURITY_CODE
        sync: false
